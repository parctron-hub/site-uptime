name: Проверка доступности сайтов

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут (UTC); GitHub может задержать на несколько минут
  workflow_dispatch:         # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить сайты и обновить данные
        run: python check.py

      - name: Закоммитить результат
        run: |
          git config user.name "uptime-bot"
          git config user.email "uptime-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "изменений нет"
          else
            git commit -m "проверка $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git pull --rebase origin main
            git push
          fi
